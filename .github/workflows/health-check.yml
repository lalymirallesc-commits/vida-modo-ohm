name: Diagnosticar web y correos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/health-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar web pública y API sin registrar interesadas
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,ssl
          urls=["https://vidamodoohm.es/","https://vida-modo-ohm-prueba.pages.dev/","https://vidamodoohm.es/api/interesadas","https://vida-modo-ohm-prueba.pages.dev/api/interesadas","https://vidamodoohm.es/regalo/Mi_primer_encuentro_contigo_CORREGIDO.pdf","https://vida-modo-ohm-prueba.pages.dev/regalo/Mi_primer_encuentro_contigo_CORREGIDO.pdf"]
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'VMOHealthCheck/1.0'})
              with urllib.request.urlopen(req,timeout=25) as res:
                first=res.read(60)
                print('HEALTH',res.status,res.headers.get('content-type'),'URL',u,'SAMPLE',repr(first[:20]))
            except urllib.error.HTTPError as e:
              print('HEALTH',e.code,'URL',u,'BODY',repr(e.read(100)))
            except Exception as e:
              print('HEALTH_ERROR',u,type(e).__name__,str(e)[:150])
          PY
      - name: Revisar enlaces Cloudflare y estado configuración
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,urllib.request,json
          url="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]+"/pages/projects/vida-modo-ohm-prueba"
          r=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
          try:
            with urllib.request.urlopen(r,timeout=30) as f:
              j=json.load(f);p=j.get('result') or {}
              print('DOMAINS',p.get('domains'),'LATEST_DEPLOYMENT',((p.get('latest_deployment') or {}).get('id')))
              for k,cfg in (p.get('deployment_configs') or {}).items():
                print('CONFIG',k,'vars',list((cfg.get('env_vars') or {}).keys()),'kv',list((cfg.get('kv_namespaces') or {}).keys()))
          except Exception as e:print('CLOUDFLARE_ERROR',type(e).__name__,str(e)[:160])
          PY
