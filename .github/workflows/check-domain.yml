name: Diagnosticar conexion Vida Modo Ohm
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-domain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar dominio y almacenamiento sin revelar datos
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,socket,base64
          root="https://api.cloudflare.com/client/v4"
          def api(path):
              req=urllib.request.Request(root+path,headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"success":False,"status":e.code}
          base="/accounts/"+os.environ["CF_ACCOUNT"]+"/pages/projects/vida-modo-ohm-prueba"
          p=api(base)
          print("PROJECT_READ",p.get("success"))
          project=p.get("result") or {}
          print("PROJECT_DOMAINS",project.get("domains"))
          for mode,config in project.get("deployment_configs",{}).items():
              print("CONFIG",mode,"bindings",sorted(config.get("env_vars") or {}),"kv",sorted(config.get("kv_namespaces") or {}))
              for binding,ns in (config.get("kv_namespaces") or {}).items():
                  if binding in ("INTERESADAS","INTERESADAS_BACKUP"):
                      ident=ns.get("namespace_id") if isinstance(ns,dict) else ns
                      res=api("/accounts/"+os.environ["CF_ACCOUNT"]+"/storage/kv/namespaces/"+ident+"/keys?limit=1000")
                      print("STORAGE",mode,binding,"accessible",res.get("success"),"key_count",len(res.get("result") or []))
          d=api(base+"/domains")
          print("DOMAINS_READ",d.get("success"))
          for v in d.get("result") or []:
              print("DOMAIN",v.get("name"),v.get("status"),"validation",v.get("validation_data",{}).get("status"))
          z=api("/zones?name=vidamodoohm.es")
          print("ZONE_READ",z.get("success"),"zone_count",len(z.get("result") or []))
          for zone in z.get("result") or []:
              print("ZONE",zone.get("name"),zone.get("status"),"nameservers",zone.get("name_servers"))
              for host in ("vidamodoohm.es","www.vidamodoohm.es"):
                  records=api("/zones/"+zone["id"]+"/dns_records?name="+host)
                  print("DNS",host,records.get("success"))
                  for rec in records.get("result") or []:
                      if rec.get("type") in ("A","AAAA","CNAME"):
                          print("RECORD",rec.get("type"),rec.get("name"),rec.get("content"),"proxied",rec.get("proxied"))
          if d.get("success") and "vidamodoohm.es" in [v.get("name") for v in d.get("result") or []] and "www.vidamodoohm.es" not in [v.get("name") for v in d.get("result") or []]:
              req=urllib.request.Request(root+base+"/domains",data=json.dumps({"name":"www.vidamodoohm.es"}).encode(),headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: added=json.load(r)
                  print("WWW_ASSOCIATION",added.get("success"),(added.get("result") or {}).get("status"))
              except urllib.error.HTTPError as e:
                  print("WWW_ASSOCIATION_FAILED",e.code)
          for host in ("vidamodoohm.es","www.vidamodoohm.es"):
              try: print("PUBLIC_DNS",host,sorted(set(x[4][0] for x in socket.getaddrinfo(host,443))))
              except Exception: print("PUBLIC_DNS_UNAVAILABLE",host)
          d=api(base+"/domains")
          for v in d.get("result") or []:
              print("AFTER_DOMAIN",v.get("name"),v.get("status"),"validation",v.get("validation_data",{}).get("status"),"error",v.get("validation_data",{}).get("error_message"))
          pending=[v for v in d.get("result") or [] if v.get("name")=="www.vidamodoohm.es" and v.get("status")!="active"]
          if pending:
              req=urllib.request.Request(root+base+"/domains/www.vidamodoohm.es",data=b"{}",headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"},method="PATCH")
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: refreshed=json.load(r)
                  v=refreshed.get("result") or {}
                  print("VALIDATION_RETRY",refreshed.get("success"),v.get("status"),"validation",v.get("validation_data",{}).get("status"),"error",v.get("validation_data",{}).get("error_message"))
              except urllib.error.HTTPError as e: print("VALIDATION_RETRY_FAILED",e.code)
          vars=(project.get("deployment_configs",{}).get("production") or {}).get("env_vars") or {}
          pwd=(vars.get("ADMIN_PASSWORD") or {}).get("value")
          usr=(vars.get("ADMIN_USER") or {}).get("value") or "laly"
          print("AUTH_CHECK_AVAILABLE",bool(pwd))
          if pwd and pwd!="*****":
              for host in ("vidamodoohm.es","vida-modo-ohm-prueba.pages.dev"):
                  req=urllib.request.Request("https://"+host+"/interesadas",headers={"Authorization":"Basic "+base64.b64encode((usr+":"+pwd).encode()).decode()})
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          r.read()
                          print("PRIVATE_DASHBOARD",host,r.status)
                  except urllib.error.HTTPError as e: print("PRIVATE_DASHBOARD",host,e.code)
          PY
